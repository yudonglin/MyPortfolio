<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Wynter Lin | AI & Data Science Engineer</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet"/>
    <meta content="Wynter Lin is an AI, Data Science, and Machine Learning Engineer. M.S. in Information Management at University of Washington. Previously published at KDD 2023."
          name="description"/>
    <meta content="Wynter Lin, AI, Data Science, Machine Learning, Engineer, Developer, Portfolio, Python, React, LLM"
          name="keywords"/>
    <!-- The placeholder below is substituted at build time from SITE.url in
         src/site.ts. It stays literal under `vite dev`, which is never crawled. -->
    <link href="__SITE_URL__/" rel="canonical"/>
    <meta content="__SITE_URL__/" property="og:url"/>
    <meta content="Wynter Lin | AI & Data Science Engineer" property="og:title"/>
    <meta content="Portfolio of Wynter Lin, specializing in machine learning, LLM applications, and full-stack development."
          property="og:description"/>
    <meta content="website" property="og:type"/>
    <meta content="summary_large_image" name="twitter:card"/>
    <meta content="Wynter Lin | AI & Data Science Engineer" name="twitter:title"/>
    <meta content="Portfolio of Wynter Lin, specializing in machine learning, LLM applications, and full-stack development."
          name="twitter:description"/>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Wynter Lin",
            "jobTitle": "AI & Data Science Engineer",
            "alumniOf": {
                "@type": "CollegeOrUniversity",
                "name": "University of Washington"
            },
            "url": "__SITE_URL__",
            "sameAs": [
                "https://github.com/yudonglin"
            ],
            "knowsAbout": [
                "Artificial Intelligence",
                "Machine Learning",
                "Data Science",
                "Full-Stack Development",
                "Python",
                "TypeScript"
            ]
        }
    </script>
    <script>
        /* Scroll-reveal content starts hidden only once we know something will
           reveal it. Without this class the stylesheet leaves everything
           visible, so a browser with no IntersectionObserver -- or no script at
           all -- never gets stranded looking at an empty page. Inline and in
           <head> so it lands before first paint, with no flash. */
        if ('IntersectionObserver' in window) document.documentElement.classList.add('js');
    </script>
</head>
<body>
<div id="root"></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
